<!DOCTYPE html>
<html lang="ko">
<head>
    <title>Dom Load 실습</title>
    <script>
        // 화면이 전부다 로드되고 나서 DOM조작을 실행 합니다.
        window.onload = () => {
            const 내이름 = prompt("이름을 입력해주세요");
            document.getElementById("이름표시하는곳").innerHTML = 내이름;
        }

        // window.addEventListener("load", function() {
        //     const 이름입력하는곳 = document.getElementById("이름입력하는곳");
        //     이름입력하는곳.innerHTML = "홍길동";
        // })
    </script>
</head>
<body>
    <span id="이름표시하는곳"></span>의 다이어리에 오신것을 환영합니다
</body>
</html>
