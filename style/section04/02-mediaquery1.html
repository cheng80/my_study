<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미디어쿼리 실습</title>
    <style>
        .네모상자 {
            width: 300px;
            height: 300px;
            background-color: coral;
        }
        /* 미디워쿼리를 이용해서 특정 뷰포트 크기 이하에서 스타일을 변경 */ 
        @media (max-width: 500px) {
            .네모상자 {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                background-color: skyblue;
            }
        }
    </style>
</head>
<body>
    <div class="네모상자">
    </div>
</body>
</html>
