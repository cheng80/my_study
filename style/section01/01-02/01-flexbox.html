<!DOCTYPE html>
<html lang="ko">
<head>
    
    <title>플랙스박스 실습</title>
    <style>
        .부모 {
            background-color: skyblue;

            /* align-items는 아이템을 수직으로 정렬 */
            align-items: flex-end; 
            height: 100px;
            display: flex;
            flex-direction: row;
            /* justify-content: space-between; */

            /* justify-content는 아이템을 수평으로 정렬 */
            justify-content: center; 
            
            /*  gap은 아이템 사이의 간격을 설정 */
            gap: 20px; 
        }
    </style>
</head>
<body>
    <div class = "부모">
        <div>메뉴</div>
        <div>알림</div>
    </div>
</body>
</html>
