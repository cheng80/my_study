<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브라우저 api</title>
    <script>
        const 브라우저API확인기능 = () => {
            const API목록 = [
                {이름: "웹 스토리지 API", 지원여부: localStorage !== undefined },
                {이름: "DOM API", 지원여부: typeof document.getElementById === "function" }, // document.getElementById() 함수가 존재하는지 확인
                {이름: "Fetch API", 지원여부: typeof fetch === "function" }, // fetch() 함수가 존재하는지 확인
                {이름: "Geolocation API", 지원여부: navigator.geolocation !== undefined }, // navigator.geolocation 객체가 존재하는지 확인
                {이름: "Notification API", 지원여부: typeof Notification === "function" }, // Notification 객체가 존재하는지 확인
                {이름: "WebSocket API", 지원여부: typeof WebSocket === "function" }, // WebSocket 객체가 존재하는지 확인
                {이름: "Service Worker API", 지원여부: 'serviceWorker' in navigator }, // navigator.serviceWorker 객체가 존재하는지 확인
                {이름: "WebRTC API", 지원여부: typeof RTCPeerConnection === "function" }, // RTCPeerConnection 객체가 존재하는지 확인
                {이름: "Web Audio API", 지원여부: typeof AudioContext === "function" || typeof webkitAudioContext === "function" }, // AudioContext 또는 webkitAudioContext 객체가 존재하는지 확인
                {이름: "WebGL API", 지원여부: (function() { 
                    const canvas = document.createElement('canvas'); 
                    return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl'))); 
                })() }, // WebGLRenderingContext 객체가 존재하고, canvas에서 webgl 또는 experimental-webgl 컨텍스트를 얻을 수 있는지 확인
                {이름: "WebVR API", 지원여부: 'getVRDisplays' in navigator }, // navigator.getVRDisplays 함수가 존재하는지 확인
                {이름: "WebXR API", 지원여부: 'xr' in navigator }, // navigator.xr 객체가 존재하는지 확인
                {이름: "Web Bluetooth API", 지원여부: 'bluetooth' in navigator }, // navigator.bluetooth 객체가 존재하는지 확인
                {이름: "Web NFC API", 지원여부: 'nfc' in navigator }, // navigator.nfc 객체가 존재하는지 확인
                {이름: "WebUSB API", 지원여부: 'usb' in navigator }, // navigator.usb 객체가 존재하는지 확인
                
            ]

            console.table(API목록);

            document.getElementById("결과").innerHTML = API목록.map((api) => {
                return `<li>${api.이름}: ${api.지원여부 ? "지원" : "미지원"}</li>`;
            }).join("");
        }
    </script>
</head>
<body>
    <h1>내 브라우저의 API 확인하기</h1>
    <p>여기서 지원 여부와, 사용자 권한을 요청하는 건 서로 다른 개념입니다.</p>
    <button onclick="브라우저API확인기능()">브라우저 API 내장함수 기능 확인버튼</button>
    <ul id="결과"></ul>
</body>
</html>
