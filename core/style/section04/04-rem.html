<!DOCTYPE html>
<html lang="ko">
<head>
    <title>Rem 사이즈</title>
    <style>
        div {
            /*
            html의 기본 font-size: 16px(1rem = 16px)
            html에서 가장 윗 단은 root이고 rem은 root em의 약자입니다.
            */
            font-size: 1rem;


            /* 
            16px *0.625 = 10px 
            1rem = 10px
            font size 1rem = 10px
            */
            font-size: 62.5%; /* 1rem = 10px */
        }

        .상자 {
            width: 10rem; /* 160px */
            height: 10rem;
            background-color: coral;
        }
    </style>
</head>
<body>
    <div class = "상자"></div>
    <div class = "상자"></div>
    <div class = "상자"></div>
</body>
</html>
