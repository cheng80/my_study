<!DOCTYPE html>
<html lang="ko">
<head>
    <title>미디어쿼리와 순서변경 실습</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            padding: 0px;
            margin: 0px;
        }
        .부모 {
            display: flex;
            flex-direction: row;
            
        }
        .이미지영역 {
            background-color: greenyellow;
            padding: 10px;
        }

        .등록영역 {
            width: 300px;
            background-color: skyblue;
            padding: 10px;
        }

        @media (max-width: 767px) {
            .부모 {
                /*기존 부모클래스의 스타일에 추가 (기존 스타일 변경이 아님)*/
                flex-direction: column;
            }
            .이미지영역 {
                order: 2;
                background-color: lightcoral;
            }
            .등록영역 {
                order: 1;
            }
        }
    </style>
</head>
<body>
    <div class = "부모">
        <div class="이미지영역">
            <img src = "./01-alvan-nee.png" width="150px" height="150px" />
            <img src = "./01-alvan-nee.png" width="150px" height="150px" />
            <img src = "./01-alvan-nee.png" width="150px" height="150px" />
            <img src = "./01-alvan-nee.png" width="150px" height="150px" />
        </div>
        <div class="등록영역">
            <h1>강아지옷 등록하기</h1>
            옷이름 : <input type="text" />
            <button>등록하기</button>
        </div>
    </div>
</body>
</html>
