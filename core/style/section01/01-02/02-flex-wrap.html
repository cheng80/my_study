<!DOCTYPE html>
<html lang="ko">
<head>
    
    <title>플랙스박스 실험</title>
    <style>
        .부모1 {
            background-color: skyblue;
            display: flex;
            flex-direction: row;
            width: 500px;
            gap: 10px;
        }
        .자식1 {
            width: 100px;
            height: 100px;
            background-color: yellow;
            border: 5px solid red;
        }
        .부모2 {
            background-color: lightgreen;
            display: flex;
            flex-direction: row; 
            width: 500px;
            gap: 10px;
            flex-wrap: wrap; /* 아이템이 부모의 너비를 넘어가면 다음 줄로 이동 */

        }
        .자식2 {
            width: 100px;
            height: 100px;
            background-color: orange;
            border: 5px solid blue;
        }
    </style>
</head>
<body>
    <div class = "부모1">
        <div class = "자식1">자식</div>
        <div class = "자식1">자식</div>
        <div class = "자식1">자식</div>
        <div class = "자식1">자식</div>
        <div class = "자식1">자식</div>
        <div class = "자식1">자식</div>
        <div class = "자식1">자식</div>
    </div>
    <div class = "부모2">
        <div class = "자식2">자식</div>
        <div class = "자식2">자식</div>
        <div class = "자식2">자식</div>
        <div class = "자식2">자식</div>
        <div class = "자식2">자식</div>
        <div class = "자식2">자식</div>
        <div class = "자식2">자식</div>
    </div>
</body>
</html>
