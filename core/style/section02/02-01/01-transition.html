<!DOCTYPE html>
<html lang="ko">
<head>
    
    <title>트랜지션 실습</title>

    <style>
        .box {
            width: 300px;
            height: 300px;
            background-color: skyblue;
            white-space: pre;/* white-space는 줄바꿈 되도록 인식 해줌 */

            /* transition effect */
            transition: 
            width 0.5s,
            height 0.5s,
            background-color 0.9s;
        }

        .box:hover {
            width: 500px;
            height: 500px;
            background-color: lightcoral;
            filter: blur(3px); /* filter는 흐리게 해주는 효과를 줌 */
        }
    </style>
</head>
<body>
    <div class = "box">
        <p>
            안녕하세요 저는 css를 학습하고 있는
            사람입니다.
        </p>
</body>
</html>
