<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모달 만들어 보기</title>
    <style>
        .모달그룹 {
            display: none;
            position: fixed;
            inset: 0;
        }
        .모달배경 {
            width: 100%;
            height: 100%;
            background-color: lightseagreen;
            opacity: 0.9;
        }
        .등록모달 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: min(400px, calc(100% - 2rem));
            min-height: 500px;
            box-sizing: border-box;
            background-color: skyblue;
        }
        .등록완료모달 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: min(700px, calc(100% - 2rem));
            min-height: 160px;
            box-sizing: border-box;
            background-color: orangered;
        }

    </style>
    <script>
        const 모달열기 = (모달종류) => {
            const 모달 = document.getElementById(모달종류);
            모달.style.display = "block";
            모달.querySelector("input, textarea, button")?.focus();
        }

        const 모달닫기 = (모달종류) => {
            document.getElementById(모달종류).style.display = "none";
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                document.querySelectorAll(".모달그룹").forEach((모달) => {
                    모달.style.display = "none";
                });
            }
        });

    </script>
</head>
<body>
    <button onclick="모달열기('등록모달그룹ID')">모달열기</button>

    <!-- 일기를 등록하는 모달 -->
    <div id="등록모달그룹ID" class="모달그룹" role="dialog" aria-modal="true" aria-labelledby="등록모달제목">
        <div id="모달배경" class="모달배경" onclick="모달닫기('등록모달그룹ID')"></div>
        <div class="등록모달">
            <h2 id="등록모달제목">일기 등록</h2>
            <div>
                <label for="일기제목">제목</label>
                <input id="일기제목" type="text">
            </div>
            <div>
                <label for="일기내용">내용</label>
                <textarea id="일기내용"></textarea>
            </div>
            <div>
                <button type="button" onclick="모달닫기('등록모달그룹ID'); 모달열기('등록완료모달그룹ID')">등록하기</button>
                <!-- <button type="button" onclick="모달닫기('등록모달그룹ID')">닫기</button> -->
            </div>
        </div>
    </div>

    <!-- 등록이 완료될때 뜨는 추가 모달 -->
    <div id="등록완료모달그룹ID" class="모달그룹" role="dialog" aria-modal="true" aria-labelledby="등록완료모달제목">
        <div class="모달배경" onclick="모달닫기('등록완료모달그룹ID')"></div>
        <div class="등록완료모달">
            <p id="등록완료모달제목">등록이 완료되었습니다.</p>
            <!-- <button type="button" onclick="모달닫기('등록완료모달그룹ID')">닫기</button> -->
        </div>
    </div>

</body>
</html>
