<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object-fit 실습</title>
    <style>
        .이미지1 {
            width: 300px;
            height: 300px;
            background-color: coral;
            object-fit: cover; /* cover, contain */
        }
        .이미지2 {
            width: 300px;
            height: 300px;
            background-color: lime;
            object-fit: contain; /* cover, contain */
        }   
    </style>

</head>
<body>2
    <div>
        cover 방식
    </div>
    <img src ="./00-image.jpg" class="이미지1" />
    <div>
        contain 방식
    </div>
    <img src ="./00-image.jpg" class="이미지2" />
</body>
</html>
